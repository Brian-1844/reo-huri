name: Construire Reo Huri

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android:
    name: Application Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Télécharger la bibliothèque de reconnaissance vocale (sherpa-onnx)
        run: |
          mkdir -p app/libs
          curl -fL --retry 3 -o app/libs/sherpa-onnx.aar \
            https://github.com/k2-fsa/sherpa-onnx/releases/download/v2.0.1/sherpa-onnx-2.0.1.aar

      - name: Construire l'APK
        run: gradle assembleRelease --no-daemon

      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk ReoHuri.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ReoHuri.apk

  windows:
    name: Logiciel Windows
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Installer les bibliothèques
        run: pip install -r ordinateur/requirements.txt pyinstaller

      - name: Inscrire le numéro de version
        run: |
          printf 'VERSION_CODE = %s\nVERSION_NAME = "1.0.%s"\nDEPOT = "%s"\n' \
            "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_NUMBER" "$GITHUB_REPOSITORY" > ordinateur/reohuri/version.py

      - name: Construire le logiciel
        working-directory: ordinateur
        run: |
          pyinstaller --noconfirm --windowed --name ReoHuri --icon reohuri.ico \
            --add-data "reohuri/reohuri.ico;reohuri" \
            --collect-all sherpa_onnx --collect-all imageio_ffmpeg ReoHuri.py

      - name: Vérifier que le logiciel construit fonctionne
        working-directory: ordinateur
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\ReoHuri\ReoHuri.exe" -ArgumentList "--autotest","rapport.txt" -Wait -PassThru
          Get-Content rapport.txt
          if ($p.ExitCode -ne 0) { exit 1 }

      - name: Préparer le fichier à télécharger
        working-directory: ordinateur/dist
        shell: pwsh
        run: Compress-Archive -Path ReoHuri -DestinationPath ..\..\ReoHuri-Windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ReoHuri-Windows.zip

  publier:
    name: Publier la version
    needs: [android, windows]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: sortie
          merge-multiple: true

      - name: Publier la version (Release)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Reo Huri 1.0.${{ github.run_number }}
          body: |
            Téléphone Android : ReoHuri.apk
            Ordinateur Windows : ReoHuri-Windows.zip (décompresser, puis lancer ReoHuri.exe)
          files: sortie/*
          make_latest: true
