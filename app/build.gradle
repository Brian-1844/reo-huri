plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

// Numéro de build GitHub = numéro de version (sert au bouton de mise à jour)
def runNumber = (System.getenv("GITHUB_RUN_NUMBER") ?: "1").toInteger()
// Dépôt GitHub où l'app cherche ses mises à jour (celui qui la construit)
def depot = System.getenv("GITHUB_REPOSITORY") ?: "Brian-1844/reo-huri"

android {
    namespace 'pf.reohuri'
    compileSdk 34

    defaultConfig {
        applicationId "pf.reohuri"
        minSdk 26
        targetSdk 34
        versionCode runNumber
        versionName "1.0.${runNumber}"

        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }

        buildConfigField "String", "GITHUB_REPO", "\"${depot}\""
    }

    signingConfigs {
        release {
            // Clé fixe : toutes les versions ont la même signature,
            // donc chaque nouvel APK s'installe par-dessus l'ancien.
            storeFile file("keystore/release.jks")
            storePassword "reohuri2026"
            keyAlias "reohuri"
            keyPassword "reohuri2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}

dependencies {
    // Partage du fichier APK pour l'installation de la mise à jour
    implementation 'androidx.core:core-ktx:1.13.1'

    // Reconnaissance vocale et ponctuation hors ligne (sherpa-onnx) : le fichier
    // .aar est téléchargé par le workflow GitHub dans app/libs/ avant la compilation
    implementation files('libs/sherpa-onnx.aar')

    // Décompression des modèles (.tar.bz2)
    implementation 'org.apache.commons:commons-compress:1.21'
}
